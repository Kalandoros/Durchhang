[project]
name = "durchhang"
version = "0.1.0"
requires-python = "==3.12.11"
dependencies = [
    "flask>=3.0,<3.1.3",
    "handcalcs>=1.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.12",
    "symengine>=0.13",
    "sympy>=1.12",
    "taipy-gui>=4.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5",
    "scipy-stubs>=1.12",
]
